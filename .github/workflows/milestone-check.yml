name: milestone-check

# The step tests for the milestone this branch builds, plus every milestone
# already merged, so a later change cannot quietly break an earlier part.
# Runs on every push and on demand (the "Run workflow" button).
on:
  push:
  workflow_dispatch:
    inputs:
      milestone:
        description: "Milestone to check, e.g. SP8. Leave blank to use the branch name (sp8-caps -> SP8)."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: milestone-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.13.1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      # Inputs arrive through env vars, never pasted into the script, so a
      # crafted milestone value cannot run commands.
      - name: Work out which milestone to check
        id: target
        env:
          INPUT_MILESTONE: ${{ inputs.milestone }}
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          m="$INPUT_MILESTONE"
          if [ -n "$m" ] && ! printf '%s' "$m" | grep -Eq '^[A-Za-z0-9]{2,4}$'; then
            echo "::error::milestone must look like SP6 or SP15"; exit 1
          fi
          if [ -z "$m" ]; then
            m=$(printf '%s' "$BRANCH" | sed -nE 's/^(sp[0-9]{1,2}|ship)([-_].*)?$/\1/p' | tr '[:lower:]' '[:upper:]')
          fi
          echo "milestone=$m" >> "$GITHUB_OUTPUT"
          echo "Checking ${m:-no branch milestone} plus everything in milestones.txt"

      - name: Cache the providers
        uses: actions/cache@v6
        with:
          path: ~/.terraform.d/plugin-cache
          key: tf-providers-${{ runner.os }}-${{ hashFiles('terraform/.terraform.lock.hcl') }}

      # fmt, init, validate, then the step tests: this branch's milestone plus
      # every milestone already merged. Results go to the job summary.
      - name: Milestone checks
        env:
          MILESTONE: ${{ steps.target.outputs.milestone }}
        run: .github/scripts/check.sh $MILESTONE all
